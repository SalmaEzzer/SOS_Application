spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: sos-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:sos}}
    username: ${DB_USERNAME:${POSTGRES_USER:sos_app}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: sos
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: sos
    schemas: sos
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
sos:
  cors:
    allowed-origins: ${SOS_CORS_ALLOWED_ORIGINS:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
